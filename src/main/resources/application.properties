# ===================================================================
# VieShift - Cấu hình Nền tảng Dịch vụ & Việc làm theo giờ
# ===================================================================
spring.application.name=vieshift
server.port=8080

# Secret đọc từ file .env (không commit) hoặc biến môi trường. Xem .env.example
spring.config.import=optional:file:.env[.properties]

# Cấu hình Cơ sở dữ liệu PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vieshift_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cấu hình nghiệp vụ Nền tảng VieShift
vieshift.platform-fee-percent=10

# URL công khai của website (dùng để tạo link trong email)
vieshift.base-url=${VIESHIFT_BASE_URL:http://localhost:8080}

# Thư mục lưu giấy tờ KYC của VieKer (KHÔNG nằm trong static, chỉ admin xem được)
vieshift.kyc-upload-dir=${VIESHIFT_KYC_DIR:uploads/kyc}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# ===================================================================
# ĐĂNG NHẬP GOOGLE (OAuth2)
# Tạo tại: https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: {base-url}/login/oauth2/code/google
# Để trống => nút Google hiển thị nhưng tạm khóa.
# ===================================================================
vieshift.google.client-id=${GOOGLE_CLIENT_ID:}
vieshift.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ===================================================================
# GỬI EMAIL (SMTP) - dùng được cho Gmail App Password, SendGrid, Brevo, Resend...
# Khi chưa cấu hình MAIL_HOST: email sẽ được in ra console log và link
# hoàn thiện hồ sơ hiển thị trực tiếp trên màn hình (chế độ phát triển).
# Ví dụ SendGrid: host=smtp.sendgrid.net, port=587, username=apikey, password=<API_KEY>
# ===================================================================
vieshift.mail.from=VieShift <${MAIL_USERNAME:}>
vieshift.mail.host=smtp.gmail.com
vieshift.mail.port=587
vieshift.mail.username=${MAIL_USERNAME:}
vieshift.mail.password=${MAIL_PASSWORD:}

# ===================================================================
# CẤU HÌNH CỔNG THANH TOÁN VNPAY SANDBOX
# ===================================================================
vieshift.vnpay.tmn-code=${VNPAY_TMN_CODE:}
vieshift.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vieshift.vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vieshift.vnpay.return-url=${VIESHIFT_BASE_URL:http://localhost:8080}/payment/vnpay-return
